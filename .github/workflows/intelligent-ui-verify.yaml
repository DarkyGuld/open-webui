name: Intelligent UI verification

on:
  push:
    branches: [intelligent-ui-foundation]
  pull_request:
    branches: [intelligent-ui-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Vitest, prompt generation and production build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci --force
      - name: Verify all frontend unit tests
        run: npm run test:frontend -- --run
      - name: Rebuild generated Intelligent UI prompt
        run: npx tsx scripts/intelligent-ui/generate-prompt.ts
      - name: Verify generated prompt matches committed source
        run: git diff --exit-code -- backend/open_webui/intelligent_ui/catalog_prompt.py
      - name: Build production frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  backend:
    name: Intelligent UI pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimal test dependencies
        run: python -m pip install pytest pytest-asyncio "pydantic>=2,<3" typer uvicorn httpx
      - name: Execute full Intelligent UI Python suite
        env:
          PYTHONPATH: backend
        run: python -m pytest -q tests/intelligent_ui

  lang-core-1x-spike:
    name: OpenUI Lang Core 1.0.1 compatibility (isolated)
    # Redundant on PRs since 1.0.1 is pinned in package.json — kept for manual runs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frozen baseline
        run: npm ci --force
      - name: Temporarily install 1.0.1 without committing manifest or lockfile
        run: npm install --no-save --package-lock=false --force @openuidev/lang-core@1.0.1
      - name: Verify installed major version
        run: node -e "import('@openuidev/lang-core').then(() => console.log(require('./node_modules/@openuidev/lang-core/package.json').version))"
      - name: Run all frontend tests against candidate
        run: npm run test:frontend -- --run
      - name: Generate candidate prompt into workspace
        run: npx tsx scripts/intelligent-ui/generate-prompt.ts
      - name: Build frontend against candidate
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
